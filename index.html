<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trattoria Gioachino | Speisekarte</title>
<style>
:root{--cream:#f6e8c8;--burg:#7a1717;--green:#244a2a;--gold:#b8862b;--dark:#24170f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--cream);font-family:Georgia,serif;color:var(--dark)}
.card{width:min(92%,520px);text-align:center;padding:42px 24px;border:3px solid var(--gold);border-radius:22px;background:#fff8e8;box-shadow:0 12px 35px #0002}
.logo{font-size:18px;letter-spacing:3px;color:var(--burg);margin-bottom:0}
h1{font-size:42px;margin:4px 0 6px;color:var(--burg)}
.sub{color:var(--green);margin:0 0 28px;font-style:italic}
a{display:block;text-decoration:none;margin:14px 0;padding:18px 16px;border-radius:14px;font-weight:bold;font-size:20px}
.de{background:var(--burg);color:white}
.en{background:var(--green);color:white}
.notice{margin-top:26px;padding-top:18px;border-top:1px solid var(--gold);font-size:14px;line-height:1.6}
small{display:block;margin-top:22px;color:#6b5845}
</style>
</head>
<body>
<main class="card">
<div class="logo">TRATTORIA</div>
<h1>GIOACHINO</h1>
<p class="sub">Buon appetito!</p>
<a class="de" href="Trattoria_Gioachino_Menu_DE.pdf">🇩🇪 Speisekarte Deutsch</a>
<a class="en" href="Trattoria_Gioachino_Menu_EN.pdf">🇬🇧 English Menu</a>
  <div class="notice"><strong>Nur Barzahlung · Cash only</strong><br>Selbstbedienung · Self-service</div>
<small>Grazie e a presto!</small>
</main>
</body>
</html>
